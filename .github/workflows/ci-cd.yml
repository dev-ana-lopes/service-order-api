name: ci-cd-service-order-api

on:
  pull_request:
  push:
    branches: [main, homolog, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.12"
  API_IMAGE_NAME: service-order-api
  K8S_NAMESPACE: service-order
  RENDERED_K8S_DIR: .rendered-k8s

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --dev
      - run: make lint
      - run: make test-cov
      - name: Validate rendered manifests
        run: |
          TMP_DIR="$(mktemp -d)"
          ENV_FILE="${TMP_DIR}/k8s.env"
          OUTPUT_DIR="${TMP_DIR}/rendered-k8s"
          cat <<'VAR' > "${ENV_FILE}"
          APP_NAME=service-order-api
          APP_VERSION=3.0.0
          ENVIRONMENT=production
          LOG_LEVEL=INFO
          LOG_JSON=true
          EMAIL_PROVIDER=NOOP
          DATABASE_URL=postgresql+asyncpg://user:pass@localhost:5432/service_order_db
          APP_BASE_URL=https://api.example.com/api
          CORS_ALLOWED_ORIGINS=https://app.example.com
          TRUSTED_HOSTS=api.example.com
          JWT_SECRET=jwt-secret-value-with-32-characters
          CUSTOMER_JWT_SECRET=customer-secret-value-with-32-characters
          CUSTOMER_JWT_ISSUER=service-order-auth-lambda/production
          APPROVAL_TOKEN_SECRET=approval-secret-value-with-32-chars
          JWT_ALGORITHM=HS256
          JWT_EXPIRATION_MINUTES=60
          APPROVAL_TOKEN_TTL_MINUTES=60
          OTEL_ENABLED=true
          OTEL_SERVICE_NAME=service-order-api
          OTEL_EXPORTER_OTLP_ENDPOINT=http://datadog-agent.observability:4318/v1/traces
          DD_SERVICE=service-order-api
          DD_ENV=production
          DD_VERSION=3.0.0
          DD_API_KEY=dd-api-key-placeholder-1234567890
          HEALTHCHECK_TIMEOUT_SECONDS=5
          VAR
          python3 scripts/deploy/render_k8s_manifests.py --env-file "${ENV_FILE}" --output-dir "${OUTPUT_DIR}" --image ghcr.io/example/service-order-api:sha-test
  build-publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image_ref=ghcr.io/${owner}/${{ env.API_IMAGE_NAME }}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: docker build -t "${{ steps.meta.outputs.image_ref }}" . && docker push "${{ steps.meta.outputs.image_ref }}"
  deploy:
    if: github.event_name != 'pull_request'
    needs: build-publish
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'homolog' }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare env file
        run: printf '%s' "${{ secrets.APP_ENV }}" > .env.deploy
      - name: Render manifests
        run: |
          python3 scripts/deploy/render_k8s_manifests.py \
            --env-file .env.deploy \
            --output-dir "${{ env.RENDERED_K8S_DIR }}" \
            --image "${{ needs.build-publish.outputs.image_ref }}"     
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key.pem
          chmod 600 ~/.ssh/ec2_key.pem
          ssh-keyscan -p "${{ vars.EC2_PORT }}" "${{ vars.EC2_HOST }}" >> ~/.ssh/known_hosts
      - name: Copy rendered manifests to EC2
        run: |
          ssh -i ~/.ssh/ec2_key.pem \
            -p "${{ vars.EC2_PORT }}" \
            "${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}" \
            "rm -rf /home/${{ vars.EC2_USER }}/.rendered-k8s && mkdir -p /home/${{ vars.EC2_USER }}/.rendered-k8s"

          scp -i ~/.ssh/ec2_key.pem \
            -P "${{ vars.EC2_PORT }}" \
            -r "${{ env.RENDERED_K8S_DIR }}/." \
            "${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}:/home/${{ vars.EC2_USER }}/.rendered-k8s/"
      - name: Apply manifests on k3s
        run: |
          ssh -i ~/.ssh/ec2_key.pem \
            -p "${{ vars.EC2_PORT }}" \
            "${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}" <<'EOF'
          set -euo pipefail

          kubectl apply -f /home/ec2-user/.rendered-k8s/namespace.yaml
          kubectl apply -f /home/ec2-user/.rendered-k8s/configmap.rendered.yaml
          kubectl apply -f /home/ec2-user/.rendered-k8s/secret.rendered.yaml

          kubectl delete job -n service-order service-order-api-migrate --ignore-not-found
          kubectl apply -f /home/ec2-user/.rendered-k8s/job-migrate.yaml
          kubectl wait --for=condition=complete job/service-order-api-migrate -n service-order --timeout=300s

          kubectl apply -f /home/ec2-user/.rendered-k8s/deployment.yaml
          kubectl apply -f /home/ec2-user/.rendered-k8s/service.yaml
          kubectl apply -f /home/ec2-user/.rendered-k8s/hpa.yaml

          if [ -f /home/ec2-user/.rendered-k8s/ingress.yaml ]; then
            kubectl apply -f /home/ec2-user/.rendered-k8s/ingress.yaml
            kubectl patch ingress service-order-api \
              -n service-order \
              --type='json' \
              -p='[
                {
                  "op": "replace",
                  "path": "/spec/rules/0/http/paths/0/path",
                  "value": "/"
                }
              ]' || true
          fi

          kubectl rollout status deployment/service-order-api -n service-order --timeout=300s
          kubectl get pods -n service-order
          kubectl get svc -n service-order
          kubectl get ingress -n service-order || true
          EOF
      - name: Smoke test public API
        run: |
          curl -f "http://${{ vars.EC2_HOST }}/health"
          curl -f "http://${{ vars.EC2_HOST }}/health/ready"
