apiVersion: v1
kind: ConfigMap
metadata:
  name: service-order-api-config
  namespace: service-order
data:
  ENVIRONMENT: "production"
  APP_BASE_URL: "https://api.example.com/api"
  LOG_LEVEL: "INFO"
  LOG_JSON: "true"
  CORS_ALLOWED_ORIGINS: "https://app.example.com"
  TRUSTED_HOSTS: "api.example.com"
  SMTP_HOST: "smtp.example.com"
  SMTP_PORT: "587"
  SMTP_USE_TLS: "true"
  SMTP_USE_AUTH: "true"
  SMTP_TIMEOUT_SECONDS: "10"
  SMTP_FROM_EMAIL: "oficina@example.com"
  APPROVAL_TOKEN_TTL_MINUTES: "60"
  JWT_ALGORITHM: "HS256"
  JWT_EXPIRATION_MINUTES: "60"
  CUSTOMER_JWT_ALGORITHM: "HS256"
  CUSTOMER_JWT_ISSUER: "service-order-auth-lambda/production"
  DD_SERVICE: "service-order-api"
  DD_ENV: "production"
  DD_VERSION: "3.0.0"
  OTEL_ENABLED: "true"
  OTEL_SERVICE_NAME: "service-order-api"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://datadog-agent.observability:4318/v1/traces"
  HEALTHCHECK_TIMEOUT_SECONDS: "5"
  MIGRATE_ON_STARTUP: "false"
